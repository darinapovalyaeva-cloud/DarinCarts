<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Anki Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Блок добавления новой карточки -->
        <div class="add-card-box">
            <h3>Добавить карточку</h3>
            <input type="text" id="new-front" placeholder="Слово на русском">
            <input type="text" id="new-back" placeholder="Перевод на английском">
            <button onclick="addNewCard()">Добавить ➕</button>
        </div>

        <!-- Счетчик оставшихся карточек -->
        <div id="counter">Осталось карточек на данный момент: 0</div>

        <!-- Контейнер для 3D карточки -->
        <div class="card-perspective">
            <div class="card-3d" id="card-element" onclick="flipCard()">
                <!-- Лицевая сторона (Русский) -->
                <div class="card-side card-front">
                    <p id="card-text-front">Нажмите «Следующая»</p>
                </div>
                <!-- Обратная сторона (Английский) -->
                <div class="card-side card-back">
                    <p id="card-text-back">Перевод</p>
                </div>
            </div>
        </div>
        
        <!-- Кнопки управления -->
        <div class="controls">
            <button onclick="speakText()" class="btn-audio">🔊 Озвучить</button>
            <div id="anki-buttons" style="display: none; margin-top: 15px;">
                <button onclick="handleAnswer(1)" class="btn-bad">Плохо (1)</button>
                <button onclick="handleAnswer(3)" class="btn-good">Нормально (3)</button>
                <button onclick="handleAnswer(5)" class="btn-easy">Отлично (5)</button>
            </div>
            <button id="btn-next" onclick="showCurrentCard()">Начать / Следующая ➡️</button>
        </div>

        <!-- Сворачиваемая панель управления -->
        <div class="manager-box">
            <div class="manager-header">
                <!-- Кнопка-спойлер для списка слов -->
                <button onclick="toggleManagerList()" id="btn-toggle-list" class="btn-toggle">Показать все карточки (0) 👇</button>
                <button onclick="resetAllIntervals()" class="btn-reset">Сбросить прогресс 🔄</button>
            </div>
            <div id="card-list" class="hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
